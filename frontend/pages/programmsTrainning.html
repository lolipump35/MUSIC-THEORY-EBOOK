<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/programmsTrainning.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <title>programmsTrainning</title>
  </head>
  <body>
    <!-- ===================================================================== -->
    <!-- NAVBAR  -->
    <div id="navbar-placeholder"></div>
    <script type="module">
      import { initNavbar } from "/tools/navbar/navbar.js";

      fetch("/tools/navbar/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("navbar-placeholder").innerHTML = html;

          initNavbar();
        });
    </script>
    <!-- ====================================================================== -->

    <!-- CONTROLLEBAR  -->
    <div id="controlbar-placeholder"></div>

    <script type="module">
      import { initControlBar } from "/tools/controlbar/controlbar.js";

      fetch("/tools/controlbar/controlbar.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("controlbar-placeholder").innerHTML = html;

          initControlBar();
        });
    </script>
    <!-- ====================================================================== -->

    <!-- SETTING  -->
    <div class="settings">
      <button id="closeSeting" class="closeButtonControllBar"><p>x</p></button>
      <div id="userPreference">
        <h2>Plateforme de streaming:</h2>
        <div class="platformContainer">
          <button class="platform-btn" data-platform="spotify">Spotify</button>
          <button class="platform-btn" data-platform="deezer">Deezer</button>
          <button class="platform-btn" data-platform="applemusic">
            Apple Music
          </button>
        </div>
      </div>
    </div>

    <!-- PROGRAMS TRAINNING  -->
    <section class="trainingLobby">
      <h1>Mes programmes d’entraînement</h1>
      <div id="trainingResult" class="modulesGrid"></div>
    </section>

    <script type="module" src="/js/dashboard.js"></script>
    <script type="module" src="/js/programmsTrainning.js"></script>
  </body>
</html>
